name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NetworkInspector.slnx

      - name: Build
        run: dotnet build NetworkInspector.slnx --configuration Release --no-restore

      - name: Pack
        run: dotnet pack NetworkInspector.slnx --configuration Release --no-build --output artifacts

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  test:
    name: Test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install tshark (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            software-properties-common
          sudo add-apt-repository -y ppa:wireshark-dev/wireshark
          sudo apt-get update -qq
          TSHARK_APT_VERSION=$(
            apt-cache madison tshark |
              awk '{print $3}' |
              grep -E '^4\.6\.' |
              head -n1
          )
          if [ -z "$TSHARK_APT_VERSION" ]; then
            echo "::error::No tshark 4.6.x package found in apt sources after adding the Wireshark PPA."
            exit 1
          fi
          echo "Installing tshark package version: $TSHARK_APT_VERSION"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            "tshark=$TSHARK_APT_VERSION"

      - name: Install tshark (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $availableVersions = @(
            choco search wireshark --exact --all-versions --limit-output |
              ForEach-Object {
                if ($_ -match '^wireshark\|([0-9]+\.[0-9]+\.[0-9]+)$') {
                  $Matches[1]
                }
              } |
              Where-Object { $_ -like '4.6.*' } |
              Sort-Object { [Version]$_ } -Descending
          )
          if ($availableVersions.Count -eq 0) {
            Write-Error "No Wireshark 4.6.x package found in Chocolatey feed."
            exit 1
          }
          $selectedVersion = $availableVersions[0]
          Write-Host "Installing Wireshark $selectedVersion from Chocolatey."
          choco install wireshark --version $selectedVersion -y --no-progress
          'C:\Program Files\Wireshark' |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install tshark (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          COMMITS_JSON=$(curl -fsSL "https://api.github.com/repos/Homebrew/homebrew-core/commits?path=Formula/w/wireshark.rb&per_page=100")
          WIRESHARK_FORMULA_SHA=$(
            printf '%s' "$COMMITS_JSON" |
              grep -oE '"sha": "[0-9a-f]{40}"' |
              awk -F'"' '{print $4}' |
              while read -r SHA; do
                FORMULA_URL="https://raw.githubusercontent.com/Homebrew/homebrew-core/$SHA/Formula/w/wireshark.rb"
                if curl -fsSL "$FORMULA_URL" | grep -qE 'wireshark-4\.6\.[0-9]+\.tar\.xz'; then
                  echo "$SHA"
                  break
                fi
              done
          )
          if [ -z "$WIRESHARK_FORMULA_SHA" ]; then
            echo "::error::Cannot find a Homebrew wireshark formula revision pinned to 4.6.x."
            exit 1
          fi
          FORMULA_URL="https://raw.githubusercontent.com/Homebrew/homebrew-core/$WIRESHARK_FORMULA_SHA/Formula/w/wireshark.rb"
          brew install --quiet "$FORMULA_URL"
          # Ensure the Homebrew default Apple Silicon prefix is available in PATH for subsequent steps.
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Verify tshark version (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TSHARK_FULL=$(tshark --version 2>&1 | head -n1)
          TSHARK_VER=$(printf '%s' "$TSHARK_FULL" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          TSHARK_MINOR=$(printf '%s' "$TSHARK_VER" | cut -d. -f1-2)
          if [ "$TSHARK_MINOR" != "4.6" ]; then
            echo "::error::tshark 4.6.x required but found: $TSHARK_FULL"
            exit 1
          fi
          echo "tshark version OK: $TSHARK_FULL"

      - name: Verify tshark version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $versionLine = (tshark --version 2>&1)[0]
          if ($versionLine -match 'TShark \(Wireshark\) (\d+)\.(\d+)\.\d+') {
            [int]$major = $Matches[1]; [int]$minor = $Matches[2]
            if ($major -ne 4 -or $minor -ne 6) {
              Write-Error "tshark 4.6.x required but found: $versionLine"
              exit 1
            }
            Write-Host "tshark version OK: $versionLine"
          } else {
            Write-Error "Cannot parse tshark version from: $versionLine"
            exit 1
          }

      - name: Restore
        run: dotnet restore NetworkInspector.slnx

      - name: Build
        run: dotnet build NetworkInspector.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test NetworkInspector.slnx --configuration Release --no-build --verbosity normal
